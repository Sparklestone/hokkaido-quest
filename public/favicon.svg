<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Warm anime sunset sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1848"/>
      <stop offset="18%" style="stop-color:#4a2868"/>
      <stop offset="35%" style="stop-color:#7a3878"/>
      <stop offset="50%" style="stop-color:#c45878"/>
      <stop offset="65%" style="stop-color:#e88068"/>
      <stop offset="78%" style="stop-color:#f8a860"/>
      <stop offset="88%" style="stop-color:#fcc84a"/>
      <stop offset="100%" style="stop-color:#ffe070"/>
    </linearGradient>
    <!-- Sunburst behind mountain -->
    <radialGradient id="sunburst" cx="50%" cy="58%" r="30%">
      <stop offset="0%" style="stop-color:#fffbe0;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#ffe080;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#f8a060;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#f8a060;stop-opacity:0"/>
    </radialGradient>
    <!-- Mountain -->
    <linearGradient id="mtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d8c8e8"/>
      <stop offset="20%" style="stop-color:#a08cb8"/>
      <stop offset="60%" style="stop-color:#6a5888"/>
      <stop offset="100%" style="stop-color:#3a2858"/>
    </linearGradient>
    <!-- Snow -->
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d0f0"/>
    </linearGradient>
    <!-- Torii red -->
    <linearGradient id="torii" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a01820"/>
      <stop offset="20%" style="stop-color:#cc2830"/>
      <stop offset="50%" style="stop-color:#e03838"/>
      <stop offset="80%" style="stop-color:#cc2830"/>
      <stop offset="100%" style="stop-color:#a01820"/>
    </linearGradient>
    <linearGradient id="toriiV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc2830"/>
      <stop offset="50%" style="stop-color:#b82228"/>
      <stop offset="100%" style="stop-color:#881018"/>
    </linearGradient>
    <!-- Cherry blossom tree -->
    <radialGradient id="bloom1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb0c0"/>
      <stop offset="40%" style="stop-color:#ff88a0"/>
      <stop offset="70%" style="stop-color:#e06080"/>
      <stop offset="100%" style="stop-color:#c04868;stop-opacity:0.7"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffc0d0"/>
      <stop offset="40%" style="stop-color:#ff98b0"/>
      <stop offset="70%" style="stop-color:#e87898"/>
      <stop offset="100%" style="stop-color:#c85878;stop-opacity:0.6"/>
    </radialGradient>
    <!-- Ground/path -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a08878"/>
      <stop offset="100%" style="stop-color:#685848"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0b0a0"/>
      <stop offset="100%" style="stop-color:#908070"/>
    </linearGradient>
  </defs>

  <!-- Rounded rect clip -->
  <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#clip)">

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sunburst glow -->
  <circle cx="256" cy="290" r="180" fill="url(#sunburst)"/>

  <!-- Sun rays (anime style) -->
  <g opacity="0.15">
    <line x1="256" y1="290" x2="256" y2="0" stroke="#ffe080" stroke-width="3"/>
    <line x1="256" y1="290" x2="100" y2="30" stroke="#ffe080" stroke-width="2"/>
    <line x1="256" y1="290" x2="412" y2="30" stroke="#ffe080" stroke-width="2"/>
    <line x1="256" y1="290" x2="40" y2="150" stroke="#ffe080" stroke-width="1.5"/>
    <line x1="256" y1="290" x2="472" y2="150" stroke="#ffe080" stroke-width="1.5"/>
    <line x1="256" y1="290" x2="0" y2="280" stroke="#ffe080" stroke-width="1"/>
    <line x1="256" y1="290" x2="512" y2="280" stroke="#ffe080" stroke-width="1"/>
    <line x1="256" y1="290" x2="150" y2="0" stroke="#ffe080" stroke-width="1.5"/>
    <line x1="256" y1="290" x2="362" y2="0" stroke="#ffe080" stroke-width="1.5"/>
  </g>

  <!-- MT. YOTEI (visible through torii) -->
  <path d="M130 390 C142 385,162 372,185 355 C205 338,225 318,240 298 C248 286,252 276,256 265 C260 276,264 286,272 298 C287 318,307 338,327 355 C350 372,370 385,382 390 Z" fill="url(#mtn)"/>

  <!-- Snow cap -->
  <path d="M256 265 C252 276,248 284,242 293 L237 298 L242 302 L236 295 L240 290 L234 286 L238 282 L244 286 L250 278 L254 280 L256 270 L258 280 L262 278 L268 286 L274 282 L278 286 L272 290 L276 295 L270 302 L275 298 L270 293 C264 284,260 276,256 265 Z" fill="url(#snow)"/>

  <!-- Sun disc (small, behind peak) -->
  <circle cx="256" cy="280" r="22" fill="#fff8e0" opacity="0.9"/>
  <circle cx="256" cy="280" r="28" fill="#ffe080" opacity="0.3"/>

  <!-- Ground plane -->
  <path d="M0 395 L512 395 L512 530 L0 530 Z" fill="url(#ground)"/>

  <!-- Stone path (perspective, narrowing toward gate) -->
  <path d="M180 530 L206 395 L306 395 L332 530 Z" fill="url(#stone)" opacity="0.7"/>
  <!-- Stone path lines -->
  <g stroke="#8a7a6a" stroke-width="1" opacity="0.3">
    <line x1="206" y1="395" x2="180" y2="530"/>
    <line x1="306" y1="395" x2="332" y2="530"/>
    <line x1="200" y1="420" x2="312" y2="420"/>
    <line x1="194" y1="445" x2="318" y2="445"/>
    <line x1="190" y1="470" x2="322" y2="470"/>
    <line x1="186" y1="495" x2="326" y2="495"/>
  </g>

  <!-- Side fences/railings (red, like reference) -->
  <g fill="#a02020" opacity="0.6">
    <!-- Left railing -->
    <rect x="175" y="395" width="3" height="110"/>
    <rect x="192" y="395" width="3" height="80"/>
    <rect x="173" y="405" width="24" height="2.5"/>
    <rect x="173" y="430" width="22" height="2.5"/>
    <!-- Right railing -->
    <rect x="334" y="395" width="3" height="110"/>
    <rect x="317" y="395" width="3" height="80"/>
    <rect x="315" y="405" width="24" height="2.5"/>
    <rect x="317" y="430" width="22" height="2.5"/>
  </g>

  <!-- ═══ CHERRY BLOSSOM TREES ═══ -->
  <!-- Left tree trunk -->
  <path d="M30 530 Q40 430 60 370 Q65 350 55 330 Q50 320 60 310" stroke="#4a2828" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M60 370 Q80 350 90 370" stroke="#4a2828" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M55 340 Q30 310 20 280" stroke="#4a2828" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M60 350 Q85 320 75 290" stroke="#4a2828" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Left blossoms -->
  <circle cx="55" cy="300" r="40" fill="url(#bloom1)"/>
  <circle cx="20" cy="270" r="35" fill="url(#bloom2)"/>
  <circle cx="80" cy="280" r="32" fill="url(#bloom1)" opacity="0.9"/>
  <circle cx="45" cy="250" r="28" fill="url(#bloom2)" opacity="0.85"/>
  <circle cx="90" cy="310" r="26" fill="url(#bloom1)" opacity="0.8"/>
  <circle cx="15" cy="310" r="22" fill="url(#bloom2)" opacity="0.7"/>
  <circle cx="95" cy="260" r="20" fill="url(#bloom1)" opacity="0.65"/>
  <!-- Left upper canopy (extends to corner) -->
  <circle cx="0" cy="200" r="45" fill="url(#bloom2)" opacity="0.7"/>
  <circle cx="30" cy="180" r="38" fill="url(#bloom1)" opacity="0.6"/>
  <circle cx="0" cy="240" r="30" fill="url(#bloom1)" opacity="0.5"/>
  <circle cx="60" cy="220" r="25" fill="url(#bloom2)" opacity="0.5"/>
  <!-- Top-left corner bloom overhang -->
  <circle cx="0" cy="120" r="50" fill="url(#bloom1)" opacity="0.5"/>
  <circle cx="40" cy="100" r="40" fill="url(#bloom2)" opacity="0.45"/>
  <circle cx="80" cy="130" r="30" fill="url(#bloom1)" opacity="0.35"/>
  <circle cx="20" cy="60" r="35" fill="url(#bloom2)" opacity="0.4"/>

  <!-- Right tree trunk -->
  <path d="M482 530 Q472 430 452 370 Q447 350 457 330 Q462 320 452 310" stroke="#4a2828" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M452 370 Q432 350 422 370" stroke="#4a2828" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M457 340 Q482 310 492 280" stroke="#4a2828" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M452 350 Q427 320 437 290" stroke="#4a2828" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Right blossoms -->
  <circle cx="457" cy="300" r="40" fill="url(#bloom2)"/>
  <circle cx="492" cy="270" r="35" fill="url(#bloom1)"/>
  <circle cx="432" cy="280" r="32" fill="url(#bloom2)" opacity="0.9"/>
  <circle cx="467" cy="250" r="28" fill="url(#bloom1)" opacity="0.85"/>
  <circle cx="422" cy="310" r="26" fill="url(#bloom2)" opacity="0.8"/>
  <circle cx="497" cy="310" r="22" fill="url(#bloom1)" opacity="0.7"/>
  <circle cx="417" cy="260" r="20" fill="url(#bloom2)" opacity="0.65"/>
  <!-- Right upper canopy -->
  <circle cx="512" cy="200" r="45" fill="url(#bloom1)" opacity="0.7"/>
  <circle cx="482" cy="180" r="38" fill="url(#bloom2)" opacity="0.6"/>
  <circle cx="512" cy="240" r="30" fill="url(#bloom2)" opacity="0.5"/>
  <circle cx="452" cy="220" r="25" fill="url(#bloom1)" opacity="0.5"/>
  <!-- Top-right corner bloom overhang -->
  <circle cx="512" cy="120" r="50" fill="url(#bloom2)" opacity="0.5"/>
  <circle cx="472" cy="100" r="40" fill="url(#bloom1)" opacity="0.45"/>
  <circle cx="432" cy="130" r="30" fill="url(#bloom2)" opacity="0.35"/>
  <circle cx="492" cy="60" r="35" fill="url(#bloom1)" opacity="0.4"/>

  <!-- ═══ TORII GATE (large, centered, foreground) ═══ -->
  <!-- Left pillar -->
  <rect x="155" y="225" width="18" height="195" rx="2" fill="url(#toriiV)"/>
  <!-- Right pillar -->
  <rect x="339" y="225" width="18" height="195" rx="2" fill="url(#toriiV)"/>
  <!-- Pillar base stones -->
  <rect x="148" y="410" width="32" height="12" rx="3" fill="#888078"/>
  <rect x="332" y="410" width="32" height="12" rx="3" fill="#888078"/>
  <!-- Kasagi (top curved beam) -->
  <path d="M128 210 Q130 195 140 196 L372 196 Q382 195 384 210 L380 218 Q378 224 370 220 L142 220 Q134 224 132 218 Z" fill="url(#torii)"/>
  <!-- Shimaki (beam directly under kasagi) -->
  <rect x="140" y="220" width="232" height="8" rx="1" fill="#a82228"/>
  <!-- Nuki (lower crossbeam) -->
  <rect x="148" y="242" width="216" height="10" rx="1" fill="url(#torii)"/>
  <!-- Gakuzuka (center nameplate/tablet) -->
  <rect x="230" y="222" width="52" height="24" rx="3" fill="#1a1020" stroke="#c8a830" stroke-width="1.5"/>
  <!-- Decorative mark on tablet -->
  <circle cx="256" cy="234" r="5" fill="none" stroke="#c8a830" stroke-width="1.2"/>
  <line x1="248" y1="234" x2="264" y2="234" stroke="#c8a830" stroke-width="0.8" opacity="0.6"/>
  <line x1="256" y1="226" x2="256" y2="242" stroke="#c8a830" stroke-width="0.8" opacity="0.6"/>

  <!-- Pillar highlight (light from sunset) -->
  <rect x="155" y="225" width="5" height="195" rx="1" fill="white" opacity="0.08"/>
  <rect x="339" y="225" width="5" height="195" rx="1" fill="white" opacity="0.08"/>

  <!-- ✿ FALLING SAKURA PETALS ✿ -->
  <g>
    <!-- Large petals in foreground -->
    <ellipse cx="130" cy="320" rx="9" ry="6" transform="rotate(-30,130,320)" fill="#ffb0c0" opacity="0.85"/>
    <ellipse cx="380" cy="290" rx="8" ry="5.5" transform="rotate(20,380,290)" fill="#ffc0d0" opacity="0.8"/>
    <ellipse cx="256" cy="180" rx="7" ry="5" transform="rotate(-15,256,180)" fill="#ffb0c0" opacity="0.7"/>
    <!-- Medium petals -->
    <ellipse cx="200" cy="250" rx="6" ry="4" transform="rotate(35,200,250)" fill="#ffc0d0" opacity="0.65"/>
    <ellipse cx="310" cy="210" rx="6.5" ry="4.5" transform="rotate(-45,310,210)" fill="#ffb0c0" opacity="0.6"/>
    <ellipse cx="170" cy="160" rx="5.5" ry="3.8" transform="rotate(10,170,160)" fill="#ffc0d0" opacity="0.55"/>
    <ellipse cx="350" cy="170" rx="5" ry="3.5" transform="rotate(-25,350,170)" fill="#ffb0c0" opacity="0.5"/>
    <!-- Small distant petals -->
    <ellipse cx="220" cy="120" rx="4" ry="2.8" transform="rotate(40,220,120)" fill="#ffc0d0" opacity="0.45"/>
    <ellipse cx="290" cy="150" rx="3.5" ry="2.5" transform="rotate(-55,290,150)" fill="#ffb0c0" opacity="0.4"/>
    <ellipse cx="180" cy="350" rx="7" ry="4.5" transform="rotate(15,180,350)" fill="#ffc0d0" opacity="0.7"/>
    <ellipse cx="330" cy="360" rx="6" ry="4" transform="rotate(-20,330,360)" fill="#ffb0c0" opacity="0.6"/>
    <ellipse cx="256" cy="340" rx="5" ry="3.5" transform="rotate(30,256,340)" fill="#ffc0d0" opacity="0.5"/>
    <ellipse cx="120" cy="200" rx="4.5" ry="3" transform="rotate(-35,120,200)" fill="#ffb0c0" opacity="0.4"/>
    <ellipse cx="400" cy="230" rx="5" ry="3.2" transform="rotate(25,400,230)" fill="#ffc0d0" opacity="0.45"/>
  </g>

  <!-- Anime sparkle stars in sky -->
  <g fill="white">
    <g transform="translate(256,50)"><path d="M0 -7 L1.2 -1.2 L7 0 L1.2 1.2 L0 7 L-1.2 1.2 L-7 0 L-1.2 -1.2 Z" opacity="0.8"/></g>
    <g transform="translate(150,80)"><path d="M0 -5 L0.9 -0.9 L5 0 L0.9 0.9 L0 5 L-0.9 0.9 L-5 0 L-0.9 -0.9 Z" opacity="0.6"/></g>
    <g transform="translate(370,65)"><path d="M0 -5 L0.9 -0.9 L5 0 L0.9 0.9 L0 5 L-0.9 0.9 L-5 0 L-0.9 -0.9 Z" opacity="0.65"/></g>
    <g transform="translate(100,40)"><path d="M0 -3.5 L0.6 -0.6 L3.5 0 L0.6 0.6 L0 3.5 L-0.6 0.6 L-3.5 0 L-0.6 -0.6 Z" opacity="0.45"/></g>
    <g transform="translate(420,35)"><path d="M0 -3.5 L0.6 -0.6 L3.5 0 L0.6 0.6 L0 3.5 L-0.6 0.6 L-3.5 0 L-0.6 -0.6 Z" opacity="0.5"/></g>
    <circle cx="200" cy="30" r="1.2" opacity="0.4"/>
    <circle cx="310" cy="25" r="1" opacity="0.35"/>
    <circle cx="450" cy="90" r="1.2" opacity="0.3"/>
    <circle cx="65" cy="80" r="1" opacity="0.3"/>
  </g>

  </g>
</svg>
