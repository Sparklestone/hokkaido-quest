<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Find adventures in Hokkaido while your family skis" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hokkaido Quest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- iOS Splash Screens -->
    <!-- iPhone 15 Pro Max / 16 Plus -->
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
          href="/splash-1290x2796.png" />
    <!-- iPhone 15 / 16 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
          href="/splash-1179x2556.png" />
    <!-- iPhone SE / 8 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
          href="/splash-750x1334.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <title>Hokkaido Quest 北海道</title>

    <style>
      * { margin: 0; padding: 0; }
      html, body, #root { 
        height: 100%; 
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      body {
        background: #0a0a1a;
        /* Prevent iOS overscroll bounce showing white */
        overscroll-behavior: none;
        /* Safe area for notched iPhones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
